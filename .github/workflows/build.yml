name: 3DS artifacts and manual full verification

# Every branch push builds downloadable console artifacts for that commit.
# Tests require an explicit manual full run. pull_request events do not start
# this workflow.
on:
  push:
  workflow_dispatch:
    inputs:
      mode:
        description: Build artifacts, run full verification, or regenerate reviewed basement textures
        type: choice
        required: true
        default: build
        options: [build, full, basement-assets]

permissions:
  contents: read

concurrency:
  # Separate commits must each finish and upload, including rapid main merges.
  group: console-${{ github.workflow }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  host:
    name: Host ${{ matrix.phase }} (${{ matrix.compiler }})
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-24.04
    # Run 39696643780 finished all 364 ordinary GCC tests, but the combined
    # job was canceled at its 180-minute ceiling after only 38/345 sanitizer
    # tests. Each phase gets a fresh bounded job; test commands stay intact.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            phase: ordinary
            cc: gcc
            cxx: g++
            ctest_args: ''
          - compiler: gcc
            phase: sanitizer
            cc: gcc
            cxx: g++
            ctest_args: ''
          - compiler: clang
            phase: ordinary
            cc: clang
            cxx: clang++
            ctest_args: --label-exclude python_unit
          - compiler: clang
            phase: sanitizer
            cc: clang
            cxx: clang++
            ctest_args: --label-exclude python_unit
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BUILD_JOBS: '4'
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Initialization follows checked .gitmodules/gitlink/lock validation.
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned host data-tool dependencies
        run: python -m pip install Pillow==12.3.0 PyYAML==6.0.3 cmake==3.31.10
      - name: Install audio restoration tools from Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Enable the validated LibYAML safe parser after installing dependencies
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci_python" >> "$GITHUB_ENV"
      - name: Initialize the pinned official submodule and verify every reviewed source byte
        run: python tools/ci_bootstrap.py
      - name: Regenerate checked resources before focused collision validation
        run: make content
      - name: Check ordered field collision results before unrelated fixture preparation
        if: matrix.phase == 'ordinary'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/collision-ci
          cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release -DENCORE_REGENERATE_NATIVE_CONTENT=OFF -DENCORE_TEST_PARALLEL=ON 2>&1 | tee build/collision-ci/configure.log
          cmake --build build/host --parallel 4 --target encore_field_collision_index_tests 2>&1 | tee build/collision-ci/build.log
          ctest --test-dir build/host --verbose --no-tests=error -R '^field_collision_index$' 2>&1 | tee build/collision-ci/plain.log
      - name: Check field collision with ASan UBSan and normal leak checking
        if: matrix.phase == 'sanitizer'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/collision-ci
          cmake -S . -B build/sanitize -DCMAKE_BUILD_TYPE=Debug -DENCORE_REGENERATE_NATIVE_CONTENT=OFF -DENCORE_TEST_PARALLEL=ON -DENCORE_SANITIZERS=ON 2>&1 | tee build/collision-ci/sanitize-configure.log
          cmake --build build/sanitize --parallel 4 --target encore_field_collision_index_tests 2>&1 | tee build/collision-ci/sanitize-build.log
          ctest --test-dir build/sanitize --verbose --no-tests=error -R '^field_collision_index$' 2>&1 | tee build/collision-ci/sanitize.log
      - name: Run the current shared-core tests
        if: matrix.phase == 'ordinary'
        # The compiler-independent Python methods all run in GCC. Clang still
        # runs every C++ consumer, source CLI and fixture test.
        # Make's content prerequisite is authoritative here; do not regenerate
        # the same resources again through CMake's default ALL target.
        # Four CTest slots; the aggregate Python test reserves all four and starts
        # at most four isolated module processes. Unreviewed writers stay serial.
        run: make test -o content CMAKE_ARGS="-DENCORE_REGENERATE_NATIVE_CONTENT=OFF -DENCORE_TEST_PARALLEL=ON" CTEST_ARGS="--parallel 4 --no-tests=error ${{ matrix.ctest_args }}"
      - name: Retain Clang coverage for Python suites that compile renderer doubles
        if: matrix.compiler == 'clang' && matrix.phase == 'ordinary'
        run: python -m unittest -v tests.test_loading_texture tests.test_loading_indicator
      - name: Run ASan and UBSan with the hosted runner's normal leak checking
        if: matrix.phase == 'sanitizer'
        # Python tools are not instrumented by this CMake sanitizer build.
        # Reuse content regenerated and admitted in this same job. This
        # phase does not depend on an ordinary job or share its build tree.
        run: make sanitize -o content CMAKE_ARGS="-DENCORE_REGENERATE_NATIVE_CONTENT=OFF -DENCORE_TEST_PARALLEL=ON" CTEST_ARGS="--parallel 4 --no-tests=error --label-exclude python_unit"
      - name: Confirm regeneration did not change tracked source or resources
        run: git diff --exit-code
      - name: Retain failure logs and current build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-diagnostics-${{ matrix.compiler }}-${{ matrix.phase }}
          if-no-files-found: warn
          path: |
            build/collision-ci/
            build/host/Testing/Temporary/LastTest.log
            build/host/Testing/Temporary/LastTestsFailed.log
            build/host/CMakeFiles/CMakeConfigureLog.yaml
            build/host/python-workers/
            build/content-jobs/
            build/sanitize/Testing/Temporary/LastTest.log
            build/sanitize/Testing/Temporary/LastTestsFailed.log
            build/sanitize/CMakeFiles/CMakeConfigureLog.yaml

  console:
    name: Real 3DSX and CIA (GPU 1:1:1)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'basement-assets')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_JOBS: '4'
      CONTENT_JOBS: '4'
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python data tools and host dependencies
        run: |
          python -m pip install Pillow==12.3.0 PyYAML==6.0.3 fontTools==4.61.1
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg build-essential pkg-config libssl-dev libpng-dev
          ffmpeg -version
          ffprobe -version
      - name: Enable the validated LibYAML safe parser after installing dependencies
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci_python" >> "$GITHUB_ENV"
      - name: Restore the SDK from the existing checksum-pinned official layers
        shell: bash
        run: |
          mkdir -p build/console-sdk/downloads
          cp tools/cloud-sdk/fetch-official-sdk.py build/console-sdk/
          cp -r tools/cloud-sdk/reference build/console-sdk/
          python build/console-sdk/fetch-official-sdk.py
          sdk="$GITHUB_WORKSPACE/build/console-sdk/sdk-image/opt/devkitpro"
          echo "DEVKITPRO=$sdk" >> "$GITHUB_ENV"
          echo "DEVKITARM=$sdk/devkitARM" >> "$GITHUB_ENV"
          echo "CTRULIB=$sdk/libctru" >> "$GITHUB_ENV"
          echo "$sdk/tools/bin" >> "$GITHUB_PATH"
          echo "$sdk/devkitARM/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/tools/bin" >> "$GITHUB_PATH"
      - name: Restore pinned CIA packaging tools from official sources
        run: |
          python tools/bootstrap_cia_tools.py --from-source --bannertool-sha256 e4259c08fe8944ebadd5f4b96f9a8603e5427338074cfc46323fbbc3410d51ed
          arm-none-eabi-g++ --version
          ldd tools/bin/bannertool
      - name: Validate the fixed official submodule before restoring any content
        run: python tools/ci_bootstrap.py
      - name: Check console header positive and negative cases
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: python tests/test_ci_console_check.py
      - name: Build a genuine ARM ELF and 3DSX with checked RomFS
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/console-ci
          make 3dsx EXPERIMENTAL_GPU_BACKGROUND=1 EXPERIMENTAL_GPU_CERTIFICATES=1 EXPERIMENTAL_GPU_TEXTURE_STRIPS=1 2>&1 | tee build/console-ci/3dsx.log
      - name: Package the genuine ARM ELF as CIA
        shell: bash
        run: |
          set -o pipefail
          # The preceding full make 3dsx already verified and built this exact
          # checkout. Package its ELF without repeating that phony prerequisite.
          make cia -o 3dsx EXPERIMENTAL_GPU_BACKGROUND=1 EXPERIMENTAL_GPU_CERTIFICATES=1 EXPERIMENTAL_GPU_TEXTURE_STRIPS=1 2>&1 | tee build/console-ci/cia.log
      - name: Extract and compare the actual packaged resources
        run: python tools/ci_console_check.py
      - name: Confirm the readonly upstream and tracked source remain unchanged
        run: |
          python tools/ci_bootstrap.py --verify-only
          git diff --exit-code
          git diff --cached --exit-code
      - name: Prepare installable artifacts with notices and commit receipt
        shell: bash
        run: |
          # Uses only the genuine outputs checked above; never rerun make release.
          python tools/release.py
          cp build/console-ci/console-check.json dist/sd/build-receipt.json
          printf 'Source commit: %s\nRun: %s/%s/actions/runs/%s\nGPU configuration: background=1 certificates=1 texture_strips=1\nScope: cross-build and extracted CIA package; emulator/hardware not run\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/sd/BUILD_INFO.txt
          (cd dist/sd && sha256sum 3ds/encore-native/encore-native.3dsx 3ds/encore-native/encore-native.smdh cias/encore-native.cia > SHA256SUMS)
      - name: Upload genuine 3DSX and CIA installable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: encore-3ds-${{ github.sha }}-${{ github.run_id }}
          path: dist/sd/
          if-no-files-found: error
          retention-days: 30
      - name: Link the downloadable package in the run summary
        shell: bash
        run: |
          printf '### 3DS build artifacts\nCommit: `%s`\n\nDownload **encore-3ds-%s-%s** from this run’s Artifacts section. The ZIP contains `3ds/encore-native/*.3dsx`, its SMDH, `cias/*.cia`, installation notes, licenses, SHA256SUMS and build receipt.\n\nTests run only in explicitly selected full mode. Emulator and hardware verification remain unperformed.\n' "$GITHUB_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Include package diagnostics in the run log
        if: always()
        shell: bash
        run: |
          for log in build/console-ci/cia-contents.log build/console-ci/cia-romfs.log; do
            if test -f "$log"; then cat "$log"; fi
          done

  basement-assets:
    name: Checked original basement textures
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'basement-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0 PyYAML==6.0.3
      - run: python tools/ci_bootstrap.py
      - name: Restore the checksum-pinned official converter
        run: |
          mkdir -p build/console-sdk/downloads
          cp tools/cloud-sdk/fetch-official-sdk.py build/console-sdk/
          cp -r tools/cloud-sdk/reference build/console-sdk/
          python build/console-sdk/fetch-official-sdk.py
      - name: Generate reviewed source art with genuine tex3ds
        run: python tools/basement_items.py compile --tex3ds build/console-sdk/sdk-image/opt/devkitpro/tools/bin/tex3ds
      - uses: actions/upload-artifact@v4
        with:
          name: basement-source-textures
          retention-days: 7
          path: |
            romfs/graphics/basement/
            content/asset-receipts/graphics/basement/source.json

# Actions artifacts are downloadable build outputs, not GitHub Releases.
# Download full Actions run logs separately into the private validation archive.
# Cross-build and extracted-package checks do not prove emulator/hardware runs.
