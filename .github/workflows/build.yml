name: Verify Encore Native source and shared core

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Quick development checks or full pre-merge verification'
        required: true
        default: full
        type: choice
        options: [quick, full]

permissions:
  contents: read

concurrency:
  # A quick push must not cancel a still-running full verification. Results
  # remain tied to their recorded head; a previous-head result is not a pass
  # for changed content.
  group: host-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'ci/full')) && 'full' || 'quick' }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick production-flow checks (gcc)
    if: >-
      (github.event_name == 'pull_request' &&
       (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')) ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'quick')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned data tools and audio restoration dependencies
        run: |
          python -m pip install Pillow==12.3.0 PyYAML==6.0.3 cmake==3.31.10
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Enable the validated safe parser
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci_python" >> "$GITHUB_ENV"
      - name: Verify the full upstream pin and regenerate checked content once
        run: |
          python tools/ci_bootstrap.py
          make content
          git diff --exit-code
      - name: Check the CI selector and production consumers
        run: |
          python -m unittest -v tests.test_ci_quick tests.test_ci_workflow_policy tests.test_ci_python_environment tests.test_ci_test_parallelism
          python tools/ci_quick.py --build-dir build/quick
      - name: Retain quick-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-diagnostics
          if-no-files-found: warn
          path: |
            build/quick/Testing/Temporary/LastTest.log
            build/quick/Testing/Temporary/LastTestsFailed.log
            build/quick/selection.json

  host:
    name: Host and sanitizers (${{ matrix.compiler }})
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') ||
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci/full')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            ctest_args: ''
          - compiler: clang
            cc: clang
            cxx: clang++
            ctest_args: --label-exclude python_unit
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BUILD_JOBS: '2'
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Initialization follows checked .gitmodules/gitlink/lock validation.
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned host data-tool dependencies
        run: python -m pip install Pillow==12.3.0 PyYAML==6.0.3 cmake==3.31.10
      - name: Install audio restoration tools from Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Enable the validated LibYAML safe parser after installing dependencies
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci_python" >> "$GITHUB_ENV"
      - name: Initialize the pinned official submodule and verify every reviewed source byte
        run: python tools/ci_bootstrap.py
      - name: Regenerate checked resources and run the current shared-core tests
        # The compiler-independent Python methods all run in GCC. Clang still
        # runs every C++ consumer, source CLI and fixture test.
        # Make's content prerequisite is authoritative here; do not regenerate
        # the same resources again through CMake's default ALL target.
        # Two CTest slots; the aggregate Python test reserves both and starts
        # at most two isolated module processes. Unreviewed writers stay serial.
        run: make test CMAKE_ARGS="-DENCORE_REGENERATE_NATIVE_CONTENT=OFF -DENCORE_TEST_PARALLEL=ON" CTEST_ARGS="--parallel 2 --no-tests=error ${{ matrix.ctest_args }}"
      - name: Retain Clang coverage for Python suites that compile renderer doubles
        if: matrix.compiler == 'clang'
        run: python -m unittest -v tests.test_loading_texture tests.test_loading_indicator
      - name: Run ASan and UBSan with the hosted runner's normal leak checking
        # Python tools are not instrumented by this CMake sanitizer build.
        # Reuse content already regenerated and admitted by the successful
        # preceding step. This job changes no source between the two builds.
        run: make sanitize -o content CMAKE_ARGS="-DENCORE_REGENERATE_NATIVE_CONTENT=OFF -DENCORE_TEST_PARALLEL=ON" CTEST_ARGS="--parallel 2 --no-tests=error --label-exclude python_unit"
      - name: Confirm regeneration did not change tracked source or resources
        run: git diff --exit-code
      - name: Retain failure logs and current build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-diagnostics-${{ matrix.compiler }}
          if-no-files-found: warn
          path: |
            build/host/Testing/Temporary/LastTest.log
            build/host/Testing/Temporary/LastTestsFailed.log
            build/host/CMakeFiles/CMakeConfigureLog.yaml
            build/host/python-workers/
            build/sanitize/Testing/Temporary/LastTest.log
            build/sanitize/Testing/Temporary/LastTestsFailed.log
            build/sanitize/CMakeFiles/CMakeConfigureLog.yaml

  console:
    name: Real 3DSX and CIA (GPU 1:1:0)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') ||
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci/full')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python data tools and host dependencies
        run: |
          python -m pip install Pillow==12.3.0 PyYAML==6.0.3 fontTools==4.61.1
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg build-essential pkg-config libssl-dev libpng-dev
          ffmpeg -version
          ffprobe -version
      - name: Enable the validated LibYAML safe parser after installing dependencies
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci_python" >> "$GITHUB_ENV"
      - name: Restore the SDK from the existing checksum-pinned official layers
        shell: bash
        run: |
          mkdir -p build/console-sdk/downloads
          cp tools/cloud-sdk/fetch-official-sdk.py build/console-sdk/
          cp -r tools/cloud-sdk/reference build/console-sdk/
          python build/console-sdk/fetch-official-sdk.py
          sdk="$GITHUB_WORKSPACE/build/console-sdk/sdk-image/opt/devkitpro"
          echo "DEVKITPRO=$sdk" >> "$GITHUB_ENV"
          echo "DEVKITARM=$sdk/devkitARM" >> "$GITHUB_ENV"
          echo "CTRULIB=$sdk/libctru" >> "$GITHUB_ENV"
          echo "$sdk/tools/bin" >> "$GITHUB_PATH"
          echo "$sdk/devkitARM/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/tools/bin" >> "$GITHUB_PATH"
      - name: Restore pinned CIA packaging tools from official sources
        run: |
          python tools/bootstrap_cia_tools.py --from-source --bannertool-sha256 e4259c08fe8944ebadd5f4b96f9a8603e5427338074cfc46323fbbc3410d51ed
          arm-none-eabi-g++ --version
          ldd tools/bin/bannertool
      - name: Validate the fixed official submodule before restoring any content
        run: python tools/ci_bootstrap.py
      - name: Check console header positive and negative cases
        run: python tests/test_ci_console_check.py
      - name: Build a genuine ARM ELF and 3DSX with checked RomFS
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/console-ci
          make 3dsx EXPERIMENTAL_GPU_BACKGROUND=1 EXPERIMENTAL_GPU_CERTIFICATES=1 EXPERIMENTAL_GPU_TEXTURE_STRIPS=0 2>&1 | tee build/console-ci/3dsx.log
      - name: Package the genuine ARM ELF as CIA
        shell: bash
        run: |
          set -o pipefail
          # The preceding full make 3dsx already verified and built this exact
          # checkout. Package its ELF without repeating that phony prerequisite.
          make cia -o 3dsx EXPERIMENTAL_GPU_BACKGROUND=1 EXPERIMENTAL_GPU_CERTIFICATES=1 EXPERIMENTAL_GPU_TEXTURE_STRIPS=0 2>&1 | tee build/console-ci/cia.log
      - name: Extract and compare the actual packaged resources
        run: python tools/ci_console_check.py
      - name: Confirm the readonly upstream and tracked source remain unchanged
        run: |
          python tools/ci_bootstrap.py --verify-only
          git diff --exit-code
          git diff --cached --exit-code
      - name: Include package diagnostics in the run log
        if: always()
        shell: bash
        run: |
          for log in build/console-ci/cia-contents.log build/console-ci/cia-romfs.log; do
            if test -f "$log"; then cat "$log"; fi
          done

# No game binaries/assets, private local logs, or release uploads. Download the
# Actions run log separately for the private validation archive.
# Cross-build and extracted-package checks do not prove emulator/hardware runs.
